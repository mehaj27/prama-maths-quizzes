<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Division by 2 | Prama Education</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--sky1:#d6f0ff;--sky2:#fff0c4;--ink:#26225a;--card:#fff;--line:#ffd86b;--ten:#1f6feb;--one:#ff7a00;--pink:#ff4f9a;--green:#0f8a50;--gtxt:#fff;--purple:#7b3fe4;--bad:#d24545;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1b2450;--sky2:#2d1f4f;--ink:#f6f0dc;--card:#202c4a;--line:#34446a;--ten:#6aaeff;--one:#ffa955;--pink:#ff8fc0;--green:#4fd18b;--gtxt:#10321f;--purple:#b99bff;--bad:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1b2450;--sky2:#2d1f4f;--ink:#f6f0dc;--card:#202c4a;--line:#34446a;--ten:#6aaeff;--one:#ffa955;--pink:#ff8fc0;--green:#4fd18b;--gtxt:#10321f;--purple:#b99bff;--bad:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--sky1),var(--sky2)) fixed;color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:20px;line-height:1.4;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:16px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:2px 0 10px;text-align:center}
.logo{width:min(250px,64vw);height:auto;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.banner b{display:block;font-size:1.8rem;font-weight:800;color:var(--pink);line-height:1}
.banner small{font-size:1rem;font-weight:700;color:var(--purple)}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 0 0 3px var(--c,var(--line));transition:transform .2s}
.dots i:nth-child(4n+1){--c:var(--pink)}.dots i:nth-child(4n+2){--c:var(--one)}.dots i:nth-child(4n+3){--c:var(--green)}.dots i:nth-child(4n){--c:var(--ten)}
.dots i.done,.dots i.on{background:var(--c)}.dots i.on{transform:scale(1.4)}
.card{border:5px solid transparent;border-radius:24px;padding:20px;min-height:380px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#ff5fa2,#ffb703,#2ec4b6,#3a86ff,#8338ec) border-box;box-shadow:0 10px 0 rgba(0,0,0,.08)}
h1,h2{margin:0 0 8px;font-weight:800;line-height:1.1;color:var(--purple)}
h1{font-size:2rem}h2{font-size:1.6rem}h2::before{content:"★ ";color:var(--one)}
p{margin:6px 0}
.t{color:var(--ten)}.o{color:var(--one)}.p{color:var(--pink)}
.cap{font-size:.9rem;opacity:.85}
.story{font-size:1.25rem;background:color-mix(in srgb,var(--pink) 10%,transparent);border-radius:18px;padding:12px 16px;margin:10px 0}
.bk{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.bc{display:flex;flex-direction:column;align-items:center}
.bc small{font-weight:800;color:var(--one);font-size:1rem}
.b{border:3px solid var(--one);border-radius:14px 14px 28px 28px;padding:4px 10px;background:color-mix(in srgb,var(--one) 14%,transparent);font-size:1.5rem;line-height:1.3;text-align:center;max-width:190px}
.ex{display:flex;align-items:flex-end;justify-content:center;gap:14px;font-size:2.4rem;font-weight:800;margin:14px 0;flex-wrap:wrap;text-align:center}
.ex small{display:block;font-size:.8rem;font-weight:700;color:var(--ink)}
.step{border-radius:16px;padding:8px 14px;margin:8px 0;border:3px solid var(--c,var(--line));background:color-mix(in srgb,var(--c,var(--line)) 14%,transparent)}
.step:nth-of-type(4n+1){--c:var(--pink)}.step:nth-of-type(4n+2){--c:var(--one)}.step:nth-of-type(4n+3){--c:var(--green)}.step:nth-of-type(4n){--c:var(--ten)}
.big{font-size:1.8rem;font-weight:800;text-align:center;margin:10px 0;border-radius:20px;padding:6px 10px;background:linear-gradient(90deg,color-mix(in srgb,var(--ten) 16%,transparent),color-mix(in srgb,var(--one) 18%,transparent))}
.q{font-size:1.6rem;font-weight:800;text-align:center;background:color-mix(in srgb,var(--ten) 9%,transparent);border-radius:18px;padding:12px 16px;margin:10px 0}
.bar{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 22px;background:linear-gradient(180deg,var(--green),color-mix(in srgb,var(--green) 80%,#000));color:var(--gtxt);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
button.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--one);outline-offset:2px}
input{font:inherit;font-size:2rem;font-weight:800;width:5ch;text-align:center;border:3px solid var(--purple);border-radius:16px;padding:6px;background:var(--card);color:var(--ink)}
.ans{text-align:center;margin-top:10px;font-weight:800;font-size:1.3rem}
.fb{min-height:3.6em;font-weight:700;margin-top:10px}
.fb.ok{color:var(--green)}.fb.bad{color:var(--bad)}
.tips li{margin:8px 0}
.stars{font-size:2.2rem;text-align:center;letter-spacing:2px}
footer.brand{text-align:center;margin:18px 0 6px;font-weight:800;font-size:1.1rem;color:var(--purple)}
.cf{position:fixed;top:-16px;width:10px;height:14px;z-index:20;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .45s ease}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}.b{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes drop{from{transform:translateY(-20px) scale(.6);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main>
<header class="banner"><svg class="logo" viewBox="0 0 460 200" role="img" aria-label="Prama Education logo"><defs><linearGradient id="pw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b3fe4"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient></defs><rect width="460" height="200" rx="28" fill="#ffffff"/><rect x="3" y="3" width="454" height="194" rx="25" fill="none" stroke="#ffd86b" stroke-width="4"/><ellipse cx="100" cy="160" rx="58" ry="9" fill="#2ec4b6" opacity="0.45"/><path d="M91 100 L94 152 L76 160 L124 160 L106 152 L109 100 Z" fill="#8a5a2b"/><circle cx="100" cy="60" r="34" fill="#7b3fe4"/><circle cx="66" cy="88" r="26" fill="#1f6feb"/><circle cx="134" cy="88" r="26" fill="#ff4f9a"/><circle cx="100" cy="92" r="28" fill="#17a864"/><circle cx="84" cy="56" r="12" fill="#ff7a00"/><circle cx="118" cy="72" r="10" fill="#ffd86b"/><g fill="#ffffff" opacity="0.85"><circle cx="96" cy="44" r="3.5"/><circle cx="140" cy="82" r="3.5"/><circle cx="58" cy="84" r="3.5"/><circle cx="104" cy="100" r="3.5"/></g><text x="190" y="108" font-family="'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif" font-size="80" font-weight="800" fill="url(#pw)">Prama</text><text x="194" y="146" font-family="'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="7" fill="#1f6feb">Education</text></svg><div><b>Division by 2</b><small>Sharing equally</small></div></header>
<div class="dots" id="dots" aria-hidden="true"></div>
<section class="card" id="card" aria-live="polite"></section>
<div class="bar" id="bar"></div>
<footer class="brand">Prama Education</footer>
</main>
<script>
function row(n){return '<div class="bk"><span class="b">'+'🍌'.repeat(n)+'</span></div>';}
function plates(total,names){
  var k=total/2;
  return '<div class="bk"><span class="bc"><span class="b">'+'🍌'.repeat(k)+'</span><small>'+(names?names[0]+': ':'')+k+'</small></span><span class="bc"><span class="b">'+'🍌'.repeat(k)+'</span><small>'+(names?names[1]+': ':'')+k+'</small></span></div>';
}
var slides=[
 {say:"Welcome to Prama Education. Meet Mina the Monkey. Mina has 8 bananas. Her best friend Momo comes to visit. Mina wants to share the bananas equally, so that they both get the same number.",
  html:'<h1>Mina the Monkey shares 🐒</h1><div class="story">Mina has <b>8 bananas</b>. Her friend Momo comes to visit. Mina wants to <b>share the bananas equally</b>, so they both get the same.</div>'+row(8)+'<p>How many bananas will each monkey get?</p>'},
 {say:"Mina gives one banana to Momo, then one to herself. Again and again, one for you, one for me, until all the bananas are shared. Each monkey gets 4 bananas. We shared 8 bananas into 2 equal groups. That is called division.",
  html:'<h2>Sharing into 2 equal groups</h2><p>One for Momo, one for Mina… again and again!</p>'+plates(8,['Mina','Momo'])+'<div class="big">8 shared into 2 groups = 4 each</div><p>Sharing equally is called <b>division</b>.</p>'},
 {say:"We write it as 8 divided by 2 equals 4. The 8 is the total number we share. The 2 is the number of equal groups. And the 4 is how many are in each group. The divide sign means shared into equal groups.",
  html:'<h2>The division sentence</h2><div class="ex"><div><b class="p">8</b><small>to share</small></div><span>÷</span><div><b class="o">2</b><small>groups</small></div><span>=</span><div><b class="t">4</b><small>in each group</small></div></div><div class="step"><b>÷</b> means <b>“shared into equal groups”</b>.</div><p class="cap">Read it: “8 divided by 2 equals 4”.</p>'},
 {say:"Dividing by 2 is the same as halving. Half of 8 is 4, because 4 plus 4 makes 8. Division is also linked to multiplication. 2 times 4 is 8. So 8 divided by 2 is 4. Use the 2 times table to help you divide by 2.",
  html:'<h2>Halves and the 2 times table</h2><div class="step"><b>Halving:</b> half of 8 is 4, because <b>4 + 4 = 8</b>.</div><div class="step"><b>Times table:</b> 2 × 4 = 8, so <b>8 ÷ 2 = 4</b>.</div><div class="big">÷ 2 is the same as halving</div><p class="cap">Fact family: 2 × 4 = 8 &nbsp; 4 × 2 = 8 &nbsp; 8 ÷ 2 = 4</p>'},
 {say:"Some numbers share equally into 2 groups. These are even numbers. They end in 0, 2, 4, 6 or 8. Odd numbers cannot be shared equally. If Mina has 7 bananas, each monkey gets 3, and 1 banana is left over. In our practice, every number can be shared equally.",
  html:'<h2>Even and odd numbers</h2><div class="step"><b>Even numbers</b> (end in 0, 2, 4, 6, 8) share equally into 2 groups.</div><div class="step"><b>Odd numbers</b> leave 1 over. 7 bananas: 3 each and 1 left.</div>'+plates(6,['Mina','Momo'])+'<p class="cap">All the practice questions can be shared equally.</p>'},
 {say:"For bigger numbers, split the number into tens and ones. Look at 48 divided by 2. Split 48 into 40 and 8. Half of 40 is 20. Half of 8 is 4. Then add: 20 plus 4 is 24. So 48 divided by 2 is 24.",
  html:'<h2>Bigger numbers: split and halve</h2><p>Split the number into <b class="t">tens</b> and <b class="o">ones</b>.</p><div class="step"><b>48 ÷ 2:</b> split 48 into <b class="t">40</b> and <b class="o">8</b></div><div class="step"><b class="t">40 ÷ 2 = 20</b> &nbsp; <b class="o">8 ÷ 2 = 4</b></div><div class="step">20 + 4 = <b>24</b></div><div class="big">48 ÷ 2 = 24</div>'},
 {say:"Remember. Division means sharing into equal groups. Dividing by 2 is halving. Use the 2 times table to check. For bigger numbers, split into tens and ones. Now let us practise!",
  html:'<h2>Remember</h2><ol class="tips"><li>Division = sharing into <b>equal groups</b>.</li><li>÷ 2 is the same as <b>halving</b>.</li><li>Check with the 2 times table: 2 × 6 = 12, so 12 ÷ 2 = 6.</li><li>Big numbers: split into <b class="t">tens</b> and <b class="o">ones</b>, then halve each.</li></ol><p>Ready? 15 questions are next.</p>'}
];
var Q=[
 {t:'Mina shares 6 bananas equally between 2 monkeys. How many bananas does each monkey get?',a:3,v:row(6),h:'Give 1 banana to each monkey again and again.',w:'3 and 3 make 6, so 6 ÷ 2 = 3.'},
 {t:'4 ÷ 2 = ?',a:2,h:'Share 4 into 2 equal groups. What + what = 4?',w:'2 + 2 = 4, so 4 ÷ 2 = 2.'},
 {t:'10 ÷ 2 = ?',a:5,h:'What number plus itself makes 10?',w:'5 + 5 = 10, so 10 ÷ 2 = 5.'},
 {t:'12 ÷ 2 = ?',a:6,h:'Think of the 2 times table: 2 × ? = 12.',w:'2 × 6 = 12, so 12 ÷ 2 = 6.'},
 {t:'What is half of 14?',a:7,h:'Half means share into 2 equal groups. What + what = 14?',w:'7 + 7 = 14, so half of 14 is 7.'},
 {t:'16 ÷ 2 = ?',a:8,h:'Think of the 2 times table: 2 × ? = 16.',w:'2 × 8 = 16, so 16 ÷ 2 = 8.'},
 {t:'2 × □ = 18. What number goes in the box?',a:9,h:'Count in twos until you reach 18.',w:'2 × 9 = 18, so the box is 9.'},
 {t:'20 ÷ 2 = ?',a:10,h:'What number plus itself makes 20?',w:'10 + 10 = 20, so 20 ÷ 2 = 10.'},
 {t:'22 stickers are shared equally between 2 children. How many stickers does each child get?',a:11,h:'Split 22 into 20 and 2. Halve each part.',w:'Half of 20 is 10 and half of 2 is 1. 10 + 1 = 11.'},
 {t:'24 ÷ 2 = ?',a:12,h:'Split 24 into 20 and 4. Halve each part.',w:'Half of 20 is 10 and half of 4 is 2. 10 + 2 = 12.'},
 {t:'26 ÷ 2 = ?',a:13,h:'Split 26 into 20 and 6. Halve each part.',w:'Half of 20 is 10 and half of 6 is 3. 10 + 3 = 13.'},
 {t:'□ ÷ 2 = 15. What number goes in the box?',a:30,h:'Use multiplication: what is 2 × 15?',w:'2 × 15 = 30, so 30 ÷ 2 = 15.'},
 {t:'48 ÷ 2 = ?',a:24,h:'Split 48 into 40 and 8. Halve each part.',w:'Half of 40 is 20 and half of 8 is 4. 20 + 4 = 24.'},
 {t:'46 marbles are shared equally between 2 friends. How many marbles does each friend get?',a:23,h:'Split 46 into 40 and 6. Halve each part.',w:'Half of 40 is 20 and half of 6 is 3. 20 + 3 = 23.'},
 {t:'68 ÷ 2 = ?',a:34,h:'Split 68 into 60 and 8. Halve each part.',w:'Half of 60 is 30 and half of 8 is 4. 30 + 4 = 34.'}
];
var i=0,qi=0,score=0,tries=0,solved=false;
var card=document.getElementById('card'),bar=document.getElementById('bar'),dots=document.getElementById('dots');
function confetti(){try{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var c=['#ff4f9a','#ffb703','#2ec4b6','#3a86ff','#8338ec','#ff7a00'];for(var k=0;k<28;k++){var s=document.createElement('span');s.className='cf';s.style.left=Math.random()*100+'vw';s.style.background=c[k%6];s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout((function(e){return function(){e.remove();};})(s),2400);}}catch(x){}}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
function setDots(n,cur){var h='';for(var k=0;k<n;k++){h+='<i class="'+(k<cur?'done':k===cur?'on':'')+'"></i>';}dots.innerHTML=h;}
function lesson(){
  var s=slides[i];card.innerHTML=s.html;setDots(slides.length,i);
  bar.innerHTML='<button class="alt" id="b">Back</button><button class="alt" id="r">Read aloud</button><button id="n">'+(i===slides.length-1?'Start practice':'Next')+'</button>';
  var b=document.getElementById('b');b.disabled=i===0;
  b.onclick=function(){i--;lesson();};
  document.getElementById('r').onclick=function(){say(s.say);};
  document.getElementById('n').onclick=function(){try{speechSynthesis.cancel();}catch(e){}if(i===slides.length-1){qi=0;score=0;quiz();}else{i++;lesson();}};
}
function quiz(){
  if(qi>=Q.length){return done();}
  var q=Q[qi];tries=0;solved=false;setDots(Q.length,qi);
  card.innerHTML='<h2>Question '+(qi+1)+' of 15</h2><div class="q">'+q.t+'</div>'+(q.v||'')+'<div class="ans">Answer: <input id="ans" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Your answer"></div><div class="fb" id="fb"></div>';
  bar.innerHTML='<button class="alt" id="l">Review lesson</button><button id="c">Check</button>';
  var el=document.getElementById('ans');el.focus();
  document.getElementById('l').onclick=function(){i=0;lesson();};
  el.onkeydown=function(e){if(e.key==='Enter'){act();}};
  document.getElementById('c').onclick=act;
  function act(){
    var btn=document.getElementById('c'),fb=document.getElementById('fb');
    if(solved){qi++;quiz();return;}
    var v=parseInt(el.value,10);
    if(isNaN(v)){fb.className='fb bad';fb.textContent='Type your answer first.';return;}
    tries++;
    if(v===q.a){
      if(tries===1)score++;
      solved=true;confetti();el.readOnly=true;fb.className='fb ok pop';fb.textContent='Yes! The answer is '+q.a+(tries===1?'. Great job!':'. You got it!');
      btn.textContent=qi===Q.length-1?'See my score':'Next question';
    }else if(tries===1){
      fb.className='fb bad';fb.textContent='Not yet. Try again! '+q.h;el.select();
    }else{
      solved=true;el.value=q.a;el.readOnly=true;
      fb.className='fb bad';fb.innerHTML='The answer is <b>'+q.a+'</b>. '+q.w;
      btn.textContent=qi===Q.length-1?'See my score':'Next question';
    }
  }
}
function done(){
  setDots(Q.length,Q.length);
  var msg=score>=14?'Super star! You are a division champion!':score>=11?'Great work! Mina is proud of you.':score>=6?'Good try! Practise once more and you will shine.':'Keep going! Watch Mina’s story again and try once more.';
  var s='';for(var k=0;k<15;k++){s+=k<score?'★':'☆';}
  card.innerHTML='<h1 style="text-align:center">You scored '+score+' out of 15</h1><div class="stars pop" aria-hidden="true">'+s+'</div><p style="text-align:center">'+msg+'</p><p class="cap" style="text-align:center">Points count when the first try is right.</p>';
  if(score>=8)confetti();
  bar.innerHTML='<button class="alt" id="l">Watch story again</button><button id="a">Practise again</button>';
  document.getElementById('l').onclick=function(){i=0;lesson();};
  document.getElementById('a').onclick=function(){qi=0;score=0;quiz();};
}
lesson();
</script>
</body>
</html>
